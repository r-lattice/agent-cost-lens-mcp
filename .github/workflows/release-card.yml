name: release-card
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: publish the Release card from the tag + its releases/ note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # One rule, one place: the guard decides whether this tag may publish
          # at all and prints the notes path. It refuses a pip-package version.
          NOTES="$(bash .github/release-guard.sh "$TAG")"
          # Title = the note's own first heading (single source; checkout
          # lightweights the triggering tag, so tag annotations are unreliable)
          TITLE="$(sed -n '1s/^# *//p' "$NOTES")"
          tail -n +2 "$NOTES" > /tmp/release-body.md
          gh release create "$TAG" --verify-tag --title "${TITLE:-$TAG}" --notes-file /tmp/release-body.md \
          || gh release edit "$TAG" --title "${TITLE:-$TAG}" --notes-file /tmp/release-body.md
