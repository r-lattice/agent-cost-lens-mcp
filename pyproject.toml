[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-lens-mcp"
version = "1.3.1"
description = "See where your agent token money goes — scrubbed metadata only, audited by preview_upload before anything is sent."
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.scripts]
acl-mcp = "acl_mcp.server:main"

[tool.setuptools]
packages = ["acl_mcp"]
